<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2f9e44" />
  <title>qBittorrent Next</title>
  <script>
    (function () {
      try {
        var theme = localStorage.getItem("theme");
        var dark =
          theme === "dark" ||
          ((!theme || theme === "system") &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    })();
  </script>
  <style>
    html {
      background-color: oklch(1 0 0);
    }
    html.dark {
      background-color: oklch(0.16 0.01 264);
    }
    #boot-splash {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background-color: inherit;
    }
    .boot-spinner {
      width: 36px;
      height: 36px;
      border-radius: 9999px;
      border: 3px solid rgba(128, 128, 128, 0.22);
      border-top-color: #2f9e44;
      animation: boot-spin 0.9s linear infinite;
    }
    @keyframes boot-spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div id="root">
    <div id="boot-splash"><div class="boot-spinner"></div></div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
