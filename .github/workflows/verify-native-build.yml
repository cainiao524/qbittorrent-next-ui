name: Verify native-platform frontend build (temporary)

on:
  push:
    branches: [fix/native-platform-frontend-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multiarch-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build multiarch OCI (no push, no login)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          outputs: type=oci,dest=/tmp/multiarch.tar

      - name: Inspect OCI index platforms
        run: |
          python3 - <<'PY'
          import json, tarfile
          with tarfile.open('/tmp/multiarch.tar') as t:
              index = json.load(t.extractfile('index.json'))
          print('index.mediaType =', index.get('mediaType'))
          for m in index['manifests']:
              print('manifest:', json.dumps(m))
          # 解析每个架构 manifest 的 config 架构字段
          for m in index['manifests']:
              digest = m['digest'].split(':')[1]
              # OCI tar 中 blob 路径形如 blobs/sha256/<hex>
              with tarfile.open('/tmp/multiarch.tar') as t:
                  data = json.load(t.extractfile('blobs/sha256/' + digest))
              cfg = data.get('config', {})
              print('config arch =', cfg.get('architecture'), 'os =', cfg.get('os'), 'for digest', m['digest'][:19])
          PY

      - name: Upload OCI artifact
        uses: actions/upload-artifact@v4
        with:
          name: multiarch-oci
          path: /tmp/multiarch.tar
          retention-days: 3
