name: Verify native-platform frontend build (temporary)

on:
  push:
    branches: [fix/native-platform-frontend-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multiarch-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build multiarch OCI (no push, no login)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          outputs: type=oci,dest=/tmp/multiarch.tar

      - name: Inspect OCI index platforms
        run: |
          python3 - <<'PY'
          import json, tarfile

          def read_blob(t, digest):
              h = digest.split(':')[1]
              with tarfile.open('/tmp/multiarch.tar') as tf:
                  return json.load(tf.extractfile('blobs/sha256/' + h))

          def walk(node, depth=0):
              mt = node.get('mediaType', '')
              if 'index' in mt:
                  for m in node.get('manifests', []):
                      print('  ' * depth + 'INDEX entry:', json.dumps(m.get('platform')))
                      sub = read_blob(None, m['digest'])
                      walk(sub, depth + 1)
              else:
                  cfg = read_blob(None, node.get('config', {}).get('digest', ''))
                  print('  ' * depth + 'MANIFEST arch:', cfg.get('architecture'), 'os:', cfg.get('os'), 'digest:', node.get('digest', '')[:19])

          with tarfile.open('/tmp/multiarch.tar') as t:
              index = json.load(t.extractfile('index.json'))
          print('index.mediaType =', index.get('mediaType'))
          walk(index)
          PY

      - name: Upload OCI artifact
        uses: actions/upload-artifact@v4
        with:
          name: multiarch-oci
          path: /tmp/multiarch.tar
          retention-days: 3
