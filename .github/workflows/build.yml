name: 验证与构建

on:
  push:
    branches: [main]
    tags: ["v*", "beta*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: 运行测试
        run: pnpm test

      - name: 构建
        run: pnpm build

      - name: 打包
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/beta')
        run: cd dist && zip -r ../qbittorrent-next-ui.zip .

      - name: 上传发行包
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/beta')
        uses: softprops/action-gh-release@v2
        with:
          files: qbittorrent-next-ui.zip
          generate_release_notes: true
