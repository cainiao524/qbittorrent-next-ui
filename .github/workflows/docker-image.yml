name: Build and publish Docker images

on:
  workflow_dispatch:
  push:
    tags: ["v*", "V*", "beta*"]

permissions:
  contents: write
  packages: write

concurrency:
  group: docker-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            lowsabishi/qbittorrent-next-ui:latest
            lowsabishi/qbittorrent-next-ui:v1.6-funky9

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/cainiao524/qbittorrent-next-ui:latest
            ghcr.io/cainiao524/qbittorrent-next-ui:v1.6-funky9

  export:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ghcr.io/cainiao524/qbittorrent-next-ui:v1.6-funky9-export

      - name: Save docker image tarball
        run: |
          docker save ghcr.io/cainiao524/qbittorrent-next-ui:v1.6-funky9-export | gzip > qbittorrent-next-ui-v1.6-funky9-docker-amd64.tar.gz

      - name: Upload docker image to Release
        uses: softprops/action-gh-release@v2
        with:
          files: qbittorrent-next-ui-v1.6-funky9-docker-amd64.tar.gz