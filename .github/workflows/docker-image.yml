name: Build test Docker image

on:
  workflow_dispatch:
  push:
    tags: ["v*", "V*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/cainiao524/qbittorrent-next-ui-test:test
            ghcr.io/cainiao524/qbittorrent-next-ui-test:sha-${{ github.sha }}
