name: Build and publish Docker images

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Release Guard
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # 1) tag 格式：仅接受 vX.Y.Z-funky9
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-funky9$ ]]; then
            echo "::error::Invalid release tag '${TAG}' (expected vX.Y.Z-funky9)"
            exit 1
          fi
          VERSION="${TAG#v}"
          VERSION="${VERSION%-funky9}"
          # 2) package.json version == X.Y.Z
          PKG_VERSION=$(grep -m1 '"version"' package.json | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')
          if [ "${PKG_VERSION}" != "${VERSION}" ]; then
            echo "::error::package.json version '${PKG_VERSION}' != tag version '${VERSION}'"
            exit 1
          fi
          # 3) APP_CONFIG.version == vX.Y.Z-funky⑨
          EXPECTED="v${VERSION}-funky⑨"
          if ! grep -q "version: \"${EXPECTED}\"" src/lib/config.ts; then
            echo "::error::APP_CONFIG.version != '${EXPECTED}'"
            exit 1
          fi
          # 4) tag commit == origin/main HEAD
          git fetch origin main --quiet
          TAG_COMMIT="$(git rev-parse HEAD)"
          MAIN_HEAD="$(git rev-parse origin/main)"
          if [ "${TAG_COMMIT}" != "${MAIN_HEAD}" ]; then
            echo "::error::tag commit ${TAG_COMMIT} != origin/main HEAD ${MAIN_HEAD}"
            exit 1
          fi
          echo "Release guard passed for ${TAG}"

      - name: Docker Hub credentials preflight
        run: |
          set -euo pipefail
          if [ -z "${DOCKERHUB_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "::error::Docker Hub credentials missing (DOCKERHUB_USERNAME/DOCKERHUB_TOKEN); refusing partial release"
            exit 1
          fi
          echo "Docker Hub credentials present"

      - name: Resolve version tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          CLEAN_TAG=$(printf '%s' "$TAG" | sed 's/⑨/9/g' | tr -c 'a-zA-Z0-9_.-' '-')
          echo "clean-tag=${CLEAN_TAG}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            lowsabishi/qbittorrent-next-ui:latest
            lowsabishi/qbittorrent-next-ui:${{ steps.version.outputs.clean-tag }}

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/cainiao524/qbittorrent-next-ui:latest
            ghcr.io/cainiao524/qbittorrent-next-ui:${{ steps.version.outputs.clean-tag }}

  update-description:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    uses: ./.github/workflows/update-dockerhub-description.yml
    secrets: inherit

  export:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          CLEAN_TAG=$(printf '%s' "$TAG" | sed 's/⑨/9/g' | tr -c 'a-zA-Z0-9_.-' '-')
          echo "clean-tag=${CLEAN_TAG}" >> "$GITHUB_OUTPUT"

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull amd64 image
        run: docker pull --platform linux/amd64 ghcr.io/cainiao524/qbittorrent-next-ui:${{ steps.version.outputs.clean-tag }}

      - name: Save amd64 image
        run: docker save ghcr.io/cainiao524/qbittorrent-next-ui:${{ steps.version.outputs.clean-tag }} | gzip > qbittorrent-next-ui-${{ steps.version.outputs.clean-tag }}-docker-amd64.tar.gz

      - name: Pull arm64 image
        run: docker pull --platform linux/arm64 ghcr.io/cainiao524/qbittorrent-next-ui:${{ steps.version.outputs.clean-tag }}

      - name: Save arm64 image
        run: docker save ghcr.io/cainiao524/qbittorrent-next-ui:${{ steps.version.outputs.clean-tag }} | gzip > qbittorrent-next-ui-${{ steps.version.outputs.clean-tag }}-docker-arm64.tar.gz

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build multiarch OCI archive
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          outputs: type=oci,dest=qbittorrent-next-ui-${{ steps.version.outputs.clean-tag }}-docker-multiarch.tar

      - name: Compress multiarch archive
        run: gzip -f qbittorrent-next-ui-${{ steps.version.outputs.clean-tag }}-docker-multiarch.tar

      - name: Upload docker images to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            qbittorrent-next-ui-${{ steps.version.outputs.clean-tag }}-docker-amd64.tar.gz
            qbittorrent-next-ui-${{ steps.version.outputs.clean-tag }}-docker-arm64.tar.gz
            qbittorrent-next-ui-${{ steps.version.outputs.clean-tag }}-docker-multiarch.tar.gz
