name: Release Staging Rehearsal

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================================
  # rehearsal-guard：任何 registry 写操作前必须通过
  # 不输出任何 job outputs（避免 secret 检测丢弃 staging repo）
  # ============================================================
  rehearsal-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CANDIDATE: qb-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5

      - name: 校验运行 ref == refs/heads/main
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::rehearsal 只允许从 main 运行 (ref=${GITHUB_REF}); fail"
            exit 1
          fi
          echo "ref OK: ${GITHUB_REF}"

      - name: 校验 HEAD == origin/main HEAD
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          LOCAL_HEAD="$(git rev-parse HEAD)"
          MAIN_HEAD="$(git rev-parse origin/main)"
          if [ "${LOCAL_HEAD}" != "${MAIN_HEAD}" ]; then
            echo "::error::HEAD ${LOCAL_HEAD} != origin/main ${MAIN_HEAD}; rehearsal 必须基于最新 main"
            exit 1
          fi
          echo "HEAD == origin/main: ${LOCAL_HEAD}"

      - name: 校验 candidate 格式
        run: |
          set -euo pipefail
          CANDIDATE="${CANDIDATE}"
          if [[ ! "${CANDIDATE}" =~ ^qb-rehearsal-[0-9]+-[0-9]+$ ]]; then
            echo "::error::candidate 格式非法: ${CANDIDATE}"
            exit 1
          fi
          echo "candidate=${CANDIDATE}"

      - name: Docker Hub credentials preflight
        run: |
          set -euo pipefail
          if [ -z "${DOCKERHUB_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "::error::Docker Hub credentials missing"
            exit 1
          fi
          echo "Docker Hub credentials present"

      - name: Candidate preexists 检查（fail-closed）
        run: |
          set -euo pipefail
          CANDIDATE="${CANDIDATE}"

          # Docker Hub API JWT
          DH_JWT=$(curl -s -X POST -H "Content-Type: application/json" \
            -d "{\"username\":\"${DOCKERHUB_USERNAME}\",\"password\":\"${DOCKERHUB_TOKEN}\"}" \
            "https://hub.docker.com/v2/users/login" | python3 -c "import json,sys; print(json.load(sys.stdin)['token'])")

          # DH candidate：200→fail / 404→continue / 其他→fail
          DH_CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: JWT ${DH_JWT}" \
            "https://hub.docker.com/v2/repositories/lowsabishi/release-staging/tags/${CANDIDATE}")
          case "${DH_CODE}" in
            200) echo "::error::DH candidate ${CANDIDATE} already exists; ownership collision"; exit 1;;
            404) echo "DH candidate absent (404)";;
            *) echo "::error::DH candidate existence UNKNOWN (HTTP ${DH_CODE}); fail-closed"; exit 1;;
          esac

          # GHCR candidate：FOUND→fail / ABSENT_CONFIRMED→continue / 包未创建(首次)→允许 / UNKNOWN→fail
          STG_TOK=$(curl -s -u "oauth2:${GITHUB_TOKEN}" \
            "https://ghcr.io/token?scope=repository:cainiao524/qb-release-staging:pull&service=ghcr.io" \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('token',''))" 2>/dev/null || true)
          if [ -z "${STG_TOK}" ]; then
            echo "::error::GHCR staging token acquisition failed; fail-closed"
            exit 1
          fi
          STG_CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${STG_TOK}" \
            "https://ghcr.io/v2/cainiao524/qb-release-staging/tags/list")
          case "${STG_CODE}" in
            404)
              echo "GHCR staging package 尚未创建（首次 rehearsal）; candidate 必然不存在"
              ;;
            200)
              if curl -s -H "Authorization: Bearer ${STG_TOK}" \
                  "https://ghcr.io/v2/cainiao524/qb-release-staging/tags/list" \
                  | python3 -c "import json,sys; print('$CANDIDATE' in json.load(sys.stdin).get('tags',[]))" | grep -q "True"; then
                echo "::error::GHCR candidate ${CANDIDATE} already exists; ownership collision"
                exit 1
              fi
              echo "GHCR candidate absent (ABSENT_CONFIRMED)"
              ;;
            *)
              echo "::error::GHCR candidate existence UNKNOWN (HTTP ${STG_CODE}); fail-closed"
              exit 1
              ;;
          esac
          echo "::notice::rehearsal-guard passed (candidate=${CANDIDATE})"

  # ============================================================
  # webui-build：与 production 等价
  # ============================================================
  webui-build:
    needs: rehearsal-guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: 安装 pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 代码规范检查
        run: pnpm lint

      - name: 类型检查
        run: pnpm typecheck

      - name: 运行测试
        run: pnpm test

      - name: 构建
        run: pnpm build

      - name: 打包 WebUI
        run: cd dist && zip -r ../qbittorrent-next-ui.zip .

      - name: 上传 WebUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: rehearsal-webui-zip
          path: qbittorrent-next-ui.zip
          if-no-files-found: error
          overwrite: true

  # ============================================================
  # staging-build：ONE BUILDKIT SOLVE → 双 staging candidate + OCI artifact
  #                + GHCR DELETE capability 真测 + 恢复
  # ============================================================
  staging-build:
    needs: rehearsal-guard
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CANDIDATE: qb-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
      DH_STAGING_REPO: lowsabishi/release-staging
      GHCR_STAGING_REPO: ghcr.io/cainiao524/qb-release-staging
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Runtime staging ref assertion（写操作前）
        run: |
          set -euo pipefail
          CANDIDATE="${CANDIDATE}"
          DH_STAGING_REPO="${DH_STAGING_REPO}"
          GHCR_STAGING_REPO="${GHCR_STAGING_REPO}"
          case "${DH_STAGING_REPO}:${CANDIDATE}" in
            "lowsabishi/release-staging:qb-rehearsal-"*) ;;
            *) echo "::error::DH write ref 非法: ${DH_STAGING_REPO}:${CANDIDATE}"; exit 1;;
          esac
          case "${GHCR_STAGING_REPO}:${CANDIDATE}" in
            "ghcr.io/cainiao524/qb-release-staging:qb-rehearsal-"*) ;;
            *) echo "::error::GHCR write ref 非法: ${GHCR_STAGING_REPO}:${CANDIDATE}"; exit 1;;
          esac
          echo "write refs asserted: ${DH_STAGING_REPO}:${CANDIDATE} + ${GHCR_STAGING_REPO}:${CANDIDATE}"

      - name: Build and push staging（ONE BUILDKIT SOLVE）
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            lowsabishi/release-staging:${{ env.CANDIDATE }}
            ghcr.io/cainiao524/qb-release-staging:${{ env.CANDIDATE }}
          outputs: type=oci,dest=qbittorrent-next-ui-rehearsal-multiarch.tar

      - name: Upload OCI multiarch artifact
        uses: actions/upload-artifact@v4
        with:
          name: rehearsal-oci-multiarch
          path: qbittorrent-next-ui-rehearsal-multiarch.tar
          if-no-files-found: error
          overwrite: true

      - name: Verify staging（分别记录 digest + 平台，不要求跨 registry digest 相等）
        run: |
          set -euo pipefail
          CANDIDATE="${CANDIDATE}"
          DH_DGST=$(docker buildx imagetools inspect "lowsabishi/release-staging:${CANDIDATE}" --format '{{.Manifest.Digest}}')
          GHCR_DGST=$(docker buildx imagetools inspect "ghcr.io/cainiao524/qb-release-staging:${CANDIDATE}" --format '{{.Manifest.Digest}}')
          echo "DH_STAGING_DIGEST=${DH_DGST}"
          echo "GHCR_STAGING_DIGEST=${GHCR_DGST}"
          for ref in "lowsabishi/release-staging:${CANDIDATE}" "ghcr.io/cainiao524/qb-release-staging:${CANDIDATE}"; do
            archs=$(docker buildx imagetools inspect "${ref}" --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')
            echo "${ref}: ${archs}"
            echo "${archs}" | grep -q "linux/amd64" || { echo "::error::${ref} 缺 amd64"; exit 1; }
            echo "${archs}" | grep -q "linux/arm64" || { echo "::error::${ref} 缺 arm64"; exit 1; }
          done
          if [ "${DH_DGST}" = "${GHCR_DGST}" ]; then
            echo "cross-registry digest equal = true"
          else
            echo "cross-registry digest equal = false（记录；非失败条件）"
          fi
          python3 - "$DH_DGST" "$GHCR_DGST" "$CANDIDATE" <<'PYEOF'
          import json, sys
          with open("rehearsal-digests.json", "w") as f:
              json.dump({"candidate": sys.argv[3],
                         "dh_candidate_digest": sys.argv[1],
                         "ghcr_initial_digest": sys.argv[2],
                         "ghcr_restored_digest": ""}, f, indent=2)
          print("rehearsal-digests.json written (initial)")
          PYEOF

      - name: Upload digests artifact
        uses: actions/upload-artifact@v4
        with:
          name: rehearsal-digests
          path: rehearsal-digests.json
          if-no-files-found: error
          overwrite: true

      - name: GHCR staging DELETE capability 真测（三态 schema + guard）
        run: |
          set -euo pipefail
          CANDIDATE="${CANDIDATE}"
          GHCR_DGST=$(docker buildx imagetools inspect "ghcr.io/cainiao524/qb-release-staging:${CANDIDATE}" --format '{{.Manifest.Digest}}')
          echo "candidate=${CANDIDATE} digest=${GHCR_DGST:0:19}"

          STG_VER_CODE=$(curl -s -o /tmp/ghcr-versions.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/user/packages/container/qb-release-staging/versions?per_page=100")
          case "${STG_VER_CODE}" in
            200) ;;
            404) echo "::error::staging package not found (404); UNKNOWN state"; exit 1;;
            *) echo "::error::staging versions UNKNOWN (HTTP ${STG_VER_CODE}); fail-closed"; exit 1;;
          esac

          VID=$(GHCR_DGST="${GHCR_DGST}" CANDIDATE="${CANDIDATE}" python3 -c '
          import json, os
          try:
              versions = json.load(open("/tmp/ghcr-versions.json"))
          except Exception:
              print("UNKNOWN_PARSE"); raise SystemExit(0)
          if not isinstance(versions, list):
              print("UNKNOWN_STRUCTURE"); raise SystemExit(0)
          dgst = os.environ.get("GHCR_DGST", "")
          cand = os.environ.get("CANDIDATE", "")
          found = False
          for v in versions:
              if not isinstance(v, dict) or not isinstance(v.get("name"), str):
                  print("UNKNOWN_STRUCTURE"); raise SystemExit(0)
              if v.get("name") == dgst:
                  found = True
                  tags = v.get("metadata", {}).get("container", {}).get("tags", [])
                  if isinstance(tags, list) and tags == [cand]:
                      vid = v.get("id")
                      if not isinstance(vid, int):
                          print("UNKNOWN_STRUCTURE"); raise SystemExit(0)
                      print(vid); raise SystemExit(0)
          print("ABSENT_TAG_MISMATCH" if found else "ABSENT_CONFIRMED")
          ')
          case "${VID}" in
            ABSENT_CONFIRMED|ABSENT_TAG_MISMATCH)
              echo "::error::GHCR version 匹配失败 (${VID}); fail-closed"; exit 1;;
            UNKNOWN_PARSE|UNKNOWN_STRUCTURE)
              echo "::error::GHCR versions 响应异常 (${VID}); fail-closed"; exit 1;;
            "")
              echo "::error::空匹配结果; fail-closed"; exit 1;;
          esac
          echo "matched version id: ${VID}"

          # DELETE body 解析脚本（顶层写入，避免嵌套 heredoc 缩进问题）
          cat > /tmp/ghcr-del-parse.py <<'PYEOF'
          import json, sys
          try:
              d = json.load(open(sys.argv[1]))
              print("  message:", str(d.get("message", ""))[:300])
              print("  documentation_url:", str(d.get("documentation_url", ""))[:300])
              print("  status:", str(d.get("status", ""))[:100])
          except Exception:
              raw = open(sys.argv[1], "rb").read()[:2048]
              print("  raw body (max 2KiB):", raw.decode(errors="replace")[:2048])
          PYEOF

          # last-tagged message 判定 + inventory guard 判定脚本（顶层写入）
          cat > /tmp/ghcr-fallback.py <<'PYEOF'
          import json, os, sys, urllib.request, urllib.error

          LAST_TAGGED_MSG = "You cannot delete the last tagged version of a package. You must delete the package instead."
          STAGING_ALLOWED = ("qb-release-staging", "trm-release-staging")
          PRODUCTION_FORBIDDEN = ("qbittorrent-next-ui", "transmission-next-vibemod")

          def api_get(url, token):
              req = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + token,
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2026-03-10",
              })
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return r.status, r.read().decode("utf-8", errors="replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8", errors="replace")
              except Exception:
                  return -1, ""

          def is_last_tagged(body_file):
              try:
                  d = json.load(open(body_file))
                  msg = str(d.get("message", ""))
              except Exception:
                  msg = ""
              return msg.strip() == LAST_TAGGED_MSG

          def inventory_guard(pkg, exp_id, exp_dgst, cand, token):
              versions = []
              page = 1
              while True:
                  url = "https://api.github.com/user/packages/container/%s/versions?per_page=100&page=%d" % (pkg, page)
                  code, body = api_get(url, token)
                  if code != 200:
                      print("UNKNOWN_HTTP_%s" % code); sys.exit(0)
                  try:
                      data = json.loads(body)
                  except Exception:
                      print("UNKNOWN_PARSE"); sys.exit(0)
                  if not isinstance(data, list):
                      print("UNKNOWN_STRUCTURE"); sys.exit(0)
                  versions.extend(data)
                  if len(data) < 100:
                      break
                  page += 1
                  if page > 50:
                      print("UNKNOWN_PAGINATION_CAP"); sys.exit(0)
              if len(versions) != 1:
                  print("GUARD_REJECTED_VERSION_COUNT_%d" % len(versions)); sys.exit(0)
              v = versions[0]
              if not isinstance(v, dict):
                  print("UNKNOWN_STRUCTURE"); sys.exit(0)
              if str(v.get("id")) != str(exp_id):
                  print("GUARD_REJECTED_ID_MISMATCH"); sys.exit(0)
              if v.get("name") != exp_dgst:
                  print("GUARD_REJECTED_DIGEST_MISMATCH"); sys.exit(0)
              metadata = v.get("metadata")
              if not isinstance(metadata, dict):
                  print("UNKNOWN_STRUCTURE"); sys.exit(0)
              container = metadata.get("container")
              if not isinstance(container, dict):
                  print("UNKNOWN_STRUCTURE"); sys.exit(0)
              tags = container.get("tags")
              if not isinstance(tags, list) or tags != [cand]:
                  print("GUARD_REJECTED_TAGS_MISMATCH"); sys.exit(0)
              print("GUARD_PASS")

          def pkg_assert(pkg):
              if pkg in PRODUCTION_FORBIDDEN:
                  print("REJECT_PRODUCTION"); sys.exit(1)
              if pkg not in STAGING_ALLOWED:
                  print("REJECT_NOT_STAGING"); sys.exit(1)
              print("PKG_ASSERT_PASS")

          cmd = sys.argv[1]
          if cmd == "is_last_tagged":
              print("LAST_TAGGED" if is_last_tagged(sys.argv[2]) else "NOT_LAST_TAGGED")
          elif cmd == "inventory":
              inventory_guard(sys.argv[2], sys.argv[3], sys.argv[4], sys.argv[5], os.environ.get("GITHUB_TOKEN", ""))
          elif cmd == "pkg_assert":
              pkg_assert(sys.argv[2])
          else:
              print("UNKNOWN_CMD"); sys.exit(2)
          PYEOF

          DELETE_BODY=/tmp/ghcr-delete.json
          DEL_CODE=$(curl -L -sS -o "${DELETE_BODY}" -w "%{http_code}" -X DELETE \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/user/packages/container/qb-release-staging/versions/${VID}" || echo "000")
          echo "DELETE version HTTP: ${DEL_CODE}"
          if [ "${DEL_CODE}" = "204" ]; then
            sleep 3
            RB_OUT=$(docker buildx imagetools inspect "ghcr.io/cainiao524/qb-release-staging:${CANDIDATE}" --format '{{.Manifest.Digest}}' 2>&1 || true)
            if echo "${RB_OUT}" | grep -q "sha256:"; then
              echo "::error::GHCR candidate 删除后仍可见"; exit 1
            fi
            echo "${RB_OUT}" | grep -qi "not found\|no such\|unknown manifest" \
              || { echo "::error::GHCR DELETE read-back UNKNOWN: ${RB_OUT}"; exit 1; }
            echo "::notice::GHCR staging DELETE capability verified (version DELETE 204 + ABSENT_CONFIRMED; cleanup_mode=version_delete)"
          else
          # ---- 非 204：完整输出 response diagnostics ----
          echo "::error::version DELETE HTTP ${DEL_CODE}; 进入 last-tagged 判定"
          python3 /tmp/ghcr-del-parse.py "${DELETE_BODY}" 2>/dev/null || true

          # ---- last-tagged message gate：仅 HTTP 400 且 message 精确匹配才可能 fallback ----
          if [ "${DEL_CODE}" != "400" ]; then
            echo "::error::GHCR staging DELETE failed (HTTP ${DEL_CODE}, 非 last-tagged); fail-closed"; exit 1
          fi
          LAST_FLAG=$(python3 /tmp/ghcr-fallback.py is_last_tagged "${DELETE_BODY}")
          if [ "${LAST_FLAG}" != "LAST_TAGGED" ]; then
            echo "::error::GHCR staging DELETE failed (400 但 message 不匹配 last-tagged); fail-closed"; exit 1
          fi
          echo "last-tagged message gate PASS"

          # ---- 完整 package inventory guard（pagination 枚举 + 单版本严格校验）----
          INV_RESULT=$(python3 /tmp/ghcr-fallback.py inventory qb-release-staging "${VID}" "${GHCR_DGST}" "${CANDIDATE}")
          echo "inventory guard: ${INV_RESULT}"
          case "${INV_RESULT}" in
            GUARD_PASS) ;;
            UNKNOWN_*) echo "::error::inventory guard UNKNOWN (${INV_RESULT}); 零 package DELETE"; exit 1;;
            *) echo "::error::inventory guard REJECTED (${INV_RESULT}); 零 package DELETE"; exit 1;;
          esac

          # ---- registry candidate digest 再次严格匹配 ----
          RB3=$(docker buildx imagetools inspect "ghcr.io/cainiao524/qb-release-staging:${CANDIDATE}" --format '{{.Manifest.Digest}}' 2>&1 || true)
          CUR3=$(echo "${RB3}" | grep -o "sha256:[a-f0-9]*" | head -1 || true)
          if [ -z "${CUR3}" ] || [ "${CUR3}" != "${GHCR_DGST}" ]; then
            echo "::error::registry digest 复核失败 (${RB3}); 零 package DELETE"; exit 1
          fi
          echo "registry digest 复核 PASS"

          # ---- whole-package DELETE 目标白名单（硬编码，禁止变量构造 production 名）----
          case "qb-release-staging" in
            qb-release-staging) ;;
            *) echo "::error::whole-package DELETE 白名单拒绝; 零 DELETE"; exit 1;;
          esac
          case "https://api.github.com/user/packages/container/qb-release-staging" in
            *qbittorrent-next-ui*|*transmission-next-vibemod*)
              echo "::error::静态断言失败: production package 名出现在 whole-package DELETE URL"; exit 1;;
          esac
          PKG_ASSERT=$(python3 /tmp/ghcr-fallback.py pkg_assert qb-release-staging)
          [ "${PKG_ASSERT}" = "PKG_ASSERT_PASS" ] || { echo "::error::pkg_assert 失败: ${PKG_ASSERT}"; exit 1; }
          echo "whole-package DELETE 白名单断言 PASS"

          # ---- WHOLE_PACKAGE_FALLBACK：DELETE whole staging package（last-tagged 唯一版本）----
          PKG_CODE=$(curl -L -sS -o /tmp/ghcr-pkg-del.json -w "%{http_code}" -X DELETE \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/user/packages/container/qb-release-staging" || echo "000")
          echo "DELETE whole package HTTP: ${PKG_CODE}"
          if [ "${PKG_CODE}" != "204" ]; then
            echo "::error::whole-package DELETE failed (HTTP ${PKG_CODE}); fail-closed"
            python3 /tmp/ghcr-del-parse.py /tmp/ghcr-pkg-del.json 2>/dev/null || true
            exit 1
          fi

          # ---- 双 read-back：REST package absent + registry candidate absent ----
          sleep 3
          REST_CODE=$(curl -s -o /tmp/ghcr-pkg-get.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/user/packages/container/qb-release-staging" 2>/dev/null || echo "000")
          echo "REST package read-back: HTTP ${REST_CODE}（404=PACKAGE_ABSENT_CONFIRMED）"
          if [ "${REST_CODE}" != "404" ]; then
            echo "::error::REST package 仍可访问 HTTP ${REST_CODE}; fail-closed"; exit 1
          fi
          RB2=$(docker buildx imagetools inspect "ghcr.io/cainiao524/qb-release-staging:${CANDIDATE}" --format '{{.Manifest.Digest}}' 2>&1 || true)
          if echo "${RB2}" | grep -qi "not found\|no such\|unknown manifest"; then
            echo "::notice::GHCR staging DELETE capability verified (whole-package last-tagged fallback 204 + REST 404 + registry ABSENT_CONFIRMED; cleanup_mode=whole_package_last_tagged_fallback)"
          elif echo "${RB2}" | grep -q "sha256:"; then
            echo "::error::whole-package DELETE 后 registry 仍 PRESENT"; exit 1
          else
            echo "::error::whole-package DELETE 后 registry read-back UNKNOWN: ${RB2}"; exit 1
          fi
          fi

      - name: 从 DH staging 恢复 GHCR candidate（imagetools create，白名单断言）
        run: |
          set -euo pipefail
          CANDIDATE="${CANDIDATE}"
          DH_DGST=$(docker buildx imagetools inspect "lowsabishi/release-staging:${CANDIDATE}" --format '{{.Manifest.Digest}}')
          case "ghcr.io/cainiao524/qb-release-staging:${CANDIDATE}" in
            "ghcr.io/cainiao524/qb-release-staging:qb-rehearsal-"*) ;;
            *) echo "::error::恢复写目标非法"; exit 1;;
          esac
          docker buildx imagetools create \
            -t "ghcr.io/cainiao524/qb-release-staging:${CANDIDATE}" \
            "lowsabishi/release-staging@${DH_DGST}"
          NEW_DGST=$(docker buildx imagetools inspect "ghcr.io/cainiao524/qb-release-staging:${CANDIDATE}" --format '{{.Manifest.Digest}}')
          archs=$(docker buildx imagetools inspect "ghcr.io/cainiao524/qb-release-staging:${CANDIDATE}" --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')
          echo "restored GHCR candidate: ${NEW_DGST} archs=${archs}"
          echo "${archs}" | grep -q "linux/amd64"
          echo "${archs}" | grep -q "linux/arm64"
          python3 - "$NEW_DGST" <<'PYEOF'
          import json, sys
          with open("rehearsal-digests.json", "r") as f:
              d = json.load(f)
          d["ghcr_restored_digest"] = sys.argv[1]
          with open("rehearsal-digests.json", "w") as f:
              json.dump(d, f, indent=2)
          print("ghcr_restored_digest recorded:", sys.argv[1][:19])
          PYEOF
          echo "::notice::GHCR candidate restored (digest ${NEW_DGST:0:19}; 跨 registry digest 相等仅记录: $([ "${NEW_DGST}" = "${DH_DGST}" ] && echo true || echo false))"

      - name: Upload digests artifact（含 restored digest）
        uses: actions/upload-artifact@v4
        with:
          name: rehearsal-digests
          path: rehearsal-digests.json
          if-no-files-found: error
          overwrite: true

  # ============================================================
  # export：5 资产 + sha256sum 验证（仅 Actions artifact）
  # ============================================================
  export:
    needs: [rehearsal-guard, webui-build, staging-build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CANDIDATE: qb-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5

      - name: 下载 WebUI artifact
        uses: actions/download-artifact@v4
        with:
          name: rehearsal-webui-zip
          path: .

      - name: 下载 OCI multiarch artifact
        uses: actions/download-artifact@v4
        with:
          name: rehearsal-oci-multiarch
          path: .

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 导出 amd64 / arm64 / multiarch（不重新 build）
        run: |
          set -euo pipefail
          CANDIDATE="${CANDIDATE}"
          docker pull --platform linux/amd64 "ghcr.io/cainiao524/qb-release-staging:${CANDIDATE}"
          # P1-2：验证实际架构，不依赖文件名
          ARCH_AMD=$(docker image inspect --format '{{.Architecture}}' "ghcr.io/cainiao524/qb-release-staging:${CANDIDATE}")
          echo "amd64 实际架构: ${ARCH_AMD}"
          [ "${ARCH_AMD}" = "amd64" ] || { echo "::error::amd64 导出架构不符: ${ARCH_AMD}"; exit 1; }
          docker save "ghcr.io/cainiao524/qb-release-staging:${CANDIDATE}" | gzip > qbittorrent-next-ui-rehearsal-docker-amd64.tar.gz
          docker pull --platform linux/arm64 "ghcr.io/cainiao524/qb-release-staging:${CANDIDATE}"
          ARCH_ARM=$(docker image inspect --format '{{.Architecture}}' "ghcr.io/cainiao524/qb-release-staging:${CANDIDATE}")
          echo "arm64 实际架构: ${ARCH_ARM}"
          [ "${ARCH_ARM}" = "arm64" ] || { echo "::error::arm64 导出架构不符: ${ARCH_ARM}"; exit 1; }
          docker save "ghcr.io/cainiao524/qb-release-staging:${CANDIDATE}" | gzip > qbittorrent-next-ui-rehearsal-docker-arm64.tar.gz
          gzip -f -k qbittorrent-next-ui-rehearsal-multiarch.tar
          mv qbittorrent-next-ui-rehearsal-multiarch.tar.gz qbittorrent-next-ui-rehearsal-docker-multiarch.tar.gz
          ls -la *.tar.gz

      - name: 生成 SHA256SUMS.txt + 验证
        run: |
          set -euo pipefail
          sha256sum \
            qbittorrent-next-ui.zip \
            qbittorrent-next-ui-rehearsal-docker-amd64.tar.gz \
            qbittorrent-next-ui-rehearsal-docker-arm64.tar.gz \
            qbittorrent-next-ui-rehearsal-docker-multiarch.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          echo "::notice::SHA256SUMS verified"

      - name: 上传 rehearsal 资产 artifact
        uses: actions/upload-artifact@v4
        with:
          name: rehearsal-assets
          path: |
            qbittorrent-next-ui.zip
            qbittorrent-next-ui-rehearsal-docker-amd64.tar.gz
            qbittorrent-next-ui-rehearsal-docker-arm64.tar.gz
            qbittorrent-next-ui-rehearsal-docker-multiarch.tar.gz
            SHA256SUMS.txt
          if-no-files-found: error
          overwrite: true

  # ============================================================
  # cleanup：always() 执行，完整 guard，输出最终状态
  # 脚本内所有行统一缩进（YAML 剥离公共缩进后顶格，heredoc 安全）
  # ============================================================
  cleanup:
    if: always()
    needs: [rehearsal-guard, webui-build, staging-build, export]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CANDIDATE: qb-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR（cleanup 独立 runner，必须显式认证）
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 下载 digests（可能不存在，continue-on-error）
        uses: actions/download-artifact@v4
        with:
          name: rehearsal-digests
          path: .
        continue-on-error: true

      - name: Staging cleanup（三态 fail-closed，残留明确输出）
        run: |
          set -euo pipefail
          CANDIDATE="${CANDIDATE}"
          DH_OK=false; GHCR_OK=false; DH_LEFTOVER=""; GHCR_LEFTOVER=""

          # GHCR REST version mapping 脚本（顶层写入，避免嵌套 heredoc 缩进问题）
          cat > /tmp/ghcr-map.py <<'PYEOF'
          import json, os
          try:
              versions = json.load(open("/tmp/ghcr-cleanup.json"))
          except Exception:
              print("UNKNOWN_PARSE"); raise SystemExit(0)
          if not isinstance(versions, list):
              print("UNKNOWN_STRUCTURE"); raise SystemExit(0)
          dgst = os.environ.get("GHCR_TARGET", "")
          cand = os.environ.get("CANDIDATE", "")
          tag_mismatch = False
          for v in versions:
              if not isinstance(v, dict) or not isinstance(v.get("name"), str):
                  print("UNKNOWN_STRUCTURE"); raise SystemExit(0)
              if v.get("name") == dgst:
                  tags = v.get("metadata", {}).get("container", {}).get("tags", [])
                  if not isinstance(tags, list):
                      print("UNKNOWN_STRUCTURE"); raise SystemExit(0)
                  if tags == [cand]:
                      vid = v.get("id")
                      if not isinstance(vid, int):
                          print("UNKNOWN_STRUCTURE"); raise SystemExit(0)
                      print(f"VID:{vid}"); raise SystemExit(0)
                  tag_mismatch = True
          if tag_mismatch:
              print("TAG_SET_MISMATCH")
          else:
              print("UNKNOWN_VERSION_MAPPING")
          PYEOF
          # DELETE body 解析脚本（顶层写入）
          cat > /tmp/ghcr-del-parse.py <<'PYEOF'
          import json, sys
          try:
              d = json.load(open(sys.argv[1]))
              print("  message:", str(d.get("message", ""))[:300])
              print("  documentation_url:", str(d.get("documentation_url", ""))[:300])
              print("  status:", str(d.get("status", ""))[:100])
          except Exception:
              raw = open(sys.argv[1], "rb").read()[:2048]
              print("  raw body (max 2KiB):", raw.decode(errors="replace")[:2048])
          PYEOF

          # last-tagged message 判定 + inventory guard 判定脚本（顶层写入）
          cat > /tmp/ghcr-fallback.py <<'PYEOF'
          import json, os, sys, urllib.request, urllib.error

          LAST_TAGGED_MSG = "You cannot delete the last tagged version of a package. You must delete the package instead."
          STAGING_ALLOWED = ("qb-release-staging", "trm-release-staging")
          PRODUCTION_FORBIDDEN = ("qbittorrent-next-ui", "transmission-next-vibemod")

          def api_get(url, token):
              req = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + token,
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2026-03-10",
              })
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return r.status, r.read().decode("utf-8", errors="replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8", errors="replace")
              except Exception:
                  return -1, ""

          def is_last_tagged(body_file):
              try:
                  d = json.load(open(body_file))
                  msg = str(d.get("message", ""))
              except Exception:
                  msg = ""
              return msg.strip() == LAST_TAGGED_MSG

          def inventory_guard(pkg, exp_id, exp_dgst, cand, token):
              versions = []
              page = 1
              while True:
                  url = "https://api.github.com/user/packages/container/%s/versions?per_page=100&page=%d" % (pkg, page)
                  code, body = api_get(url, token)
                  if code != 200:
                      print("UNKNOWN_HTTP_%s" % code); sys.exit(0)
                  try:
                      data = json.loads(body)
                  except Exception:
                      print("UNKNOWN_PARSE"); sys.exit(0)
                  if not isinstance(data, list):
                      print("UNKNOWN_STRUCTURE"); sys.exit(0)
                  versions.extend(data)
                  if len(data) < 100:
                      break
                  page += 1
                  if page > 50:
                      print("UNKNOWN_PAGINATION_CAP"); sys.exit(0)
              if len(versions) != 1:
                  print("GUARD_REJECTED_VERSION_COUNT_%d" % len(versions)); sys.exit(0)
              v = versions[0]
              if not isinstance(v, dict):
                  print("UNKNOWN_STRUCTURE"); sys.exit(0)
              if str(v.get("id")) != str(exp_id):
                  print("GUARD_REJECTED_ID_MISMATCH"); sys.exit(0)
              if v.get("name") != exp_dgst:
                  print("GUARD_REJECTED_DIGEST_MISMATCH"); sys.exit(0)
              metadata = v.get("metadata")
              if not isinstance(metadata, dict):
                  print("UNKNOWN_STRUCTURE"); sys.exit(0)
              container = metadata.get("container")
              if not isinstance(container, dict):
                  print("UNKNOWN_STRUCTURE"); sys.exit(0)
              tags = container.get("tags")
              if not isinstance(tags, list) or tags != [cand]:
                  print("GUARD_REJECTED_TAGS_MISMATCH"); sys.exit(0)
              print("GUARD_PASS")

          def pkg_assert(pkg):
              if pkg in PRODUCTION_FORBIDDEN:
                  print("REJECT_PRODUCTION"); sys.exit(1)
              if pkg not in STAGING_ALLOWED:
                  print("REJECT_NOT_STAGING"); sys.exit(1)
              print("PKG_ASSERT_PASS")

          cmd = sys.argv[1]
          if cmd == "is_last_tagged":
              print("LAST_TAGGED" if is_last_tagged(sys.argv[2]) else "NOT_LAST_TAGGED")
          elif cmd == "inventory":
              inventory_guard(sys.argv[2], sys.argv[3], sys.argv[4], sys.argv[5], os.environ.get("GITHUB_TOKEN", ""))
          elif cmd == "pkg_assert":
              pkg_assert(sys.argv[2])
          else:
              print("UNKNOWN_CMD"); sys.exit(2)
          PYEOF

          # 入口重新验证 candidate（guard 失败时无 outputs 可依赖，必须自行校验）
          if [[ ! "${CANDIDATE}" =~ ^qb-rehearsal-[0-9]+-[0-9]+$ ]]; then
            echo "::error::candidate 非法或为空: '${CANDIDATE}'；不执行任何 DELETE"
            echo "## REHEARSAL_PARTIAL" >> "$GITHUB_STEP_SUMMARY"
            echo "- repository: ${{ github.repository }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- candidate: ${CANDIDATE:-<empty>}" >> "$GITHUB_STEP_SUMMARY"
            echo "- 原因: candidate 格式校验失败，未执行任何删除" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          PRE_OK=true
          if [ "${{ needs.webui-build.result }}" != "success" ] || [ "${{ needs.staging-build.result }}" != "success" ] || [ "${{ needs.export.result }}" != "success" ]; then
            PRE_OK=false
          fi

          # 读取 digest artifact（若存在）
          DH_SNAP=""; GHCR_INITIAL=""; GHCR_RESTORED=""
          if [ -f rehearsal-digests.json ]; then
            DH_SNAP=$(python3 -c "import json; print(json.load(open('rehearsal-digests.json'))['dh_candidate_digest'])" 2>/dev/null || true)
            GHCR_INITIAL=$(python3 -c "import json; print(json.load(open('rehearsal-digests.json'))['ghcr_initial_digest'])" 2>/dev/null || true)
            GHCR_RESTORED=$(python3 -c "import json; print(json.load(open('rehearsal-digests.json'))['ghcr_restored_digest'])" 2>/dev/null || true)
          fi

          # --- DH candidate cleanup：exact read-back 三态（404→OK 不依赖 digest）---
          DH_JWT=""
          if ! DH_JWT=$(curl -s -X POST -H "Content-Type: application/json" \
            -d "{\"username\":\"${DOCKERHUB_USERNAME}\",\"password\":\"${DOCKERHUB_TOKEN}\"}" \
            "https://hub.docker.com/v2/users/login" | python3 -c "import json,sys; print(json.load(sys.stdin)['token'])" 2>/dev/null); then
            DH_JWT=""
          fi
          if [ -z "${DH_JWT}" ]; then
            DH_LEFTOVER="DH JWT 获取失败 (UNKNOWN)"
          else
            DH_STATE=$(curl -s -o /tmp/dh-tag.json -w "%{http_code}" -H "Authorization: JWT ${DH_JWT}" \
              "https://hub.docker.com/v2/repositories/lowsabishi/release-staging/tags/${CANDIDATE}" 2>/dev/null || echo "000")
            case "${DH_STATE}" in
              404)
                DH_OK=true
                ;;
              200)
                CUR_DGST=$(python3 -c "import json; print(json.load(open('/tmp/dh-tag.json')).get('digest',''))" 2>/dev/null || true)
                if [ -z "${CUR_DGST}" ]; then
                  DH_LEFTOVER="tag 200 但 digest 解析失败 (UNKNOWN)"
                elif [ -z "${DH_SNAP}" ]; then
                  DH_LEFTOVER="PRESENT 但无 snapshot digest; 禁止删除 (UNKNOWN)"
                elif [ "${CUR_DGST}" != "${DH_SNAP}" ]; then
                  DH_LEFTOVER="digest mismatch cur=${CUR_DGST:0:19} snap=${DH_SNAP:0:19} (guard 拒绝)"
                else
                  DEL_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE -H "Authorization: JWT ${DH_JWT}" \
                    "https://hub.docker.com/v2/repositories/lowsabishi/release-staging/tags/${CANDIDATE}" 2>/dev/null || echo "000")
                  if [ "${DEL_CODE}" = "202" ] || [ "${DEL_CODE}" = "204" ]; then
                    sleep 2
                    GONE=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: JWT ${DH_JWT}" \
                      "https://hub.docker.com/v2/repositories/lowsabishi/release-staging/tags/${CANDIDATE}" 2>/dev/null || echo "000")
                    if [ "${GONE}" = "404" ]; then DH_OK=true; else DH_LEFTOVER="post-delete read-back HTTP ${GONE} (UNKNOWN)"; fi
                  else
                    DH_LEFTOVER="delete HTTP ${DEL_CODE}"
                  fi
                fi
                ;;
              *)
                DH_LEFTOVER="existence HTTP ${DH_STATE} (UNKNOWN; 禁止删除)"
                ;;
            esac
          fi

          # --- GHCR candidate cleanup（Bug3 顺序）：先 exact candidate read-back，再 digest ---
          RB_OUT=$(docker buildx imagetools inspect "ghcr.io/cainiao524/qb-release-staging:${CANDIDATE}" --format '{{.Manifest.Digest}}' 2>&1 || true)
          if echo "${RB_OUT}" | grep -qi "not found\|no such\|unknown manifest"; then
            GHCR_OK=true
          elif echo "${RB_OUT}" | grep -q "sha256:"; then
            CURRENT_GHCR_DIGEST=$(echo "${RB_OUT}" | grep -o "sha256:[a-f0-9]*" | head -1)
            echo "GHCR candidate PRESENT: ${CURRENT_GHCR_DIGEST:0:19}"
            GHCR_TARGET="${GHCR_RESTORED:-${GHCR_INITIAL}}"
            if [ -z "${GHCR_TARGET}" ]; then
              GHCR_LEFTOVER="PRESENT 但无可信 digest（restored/initial 缺失）; 禁止删除 (UNKNOWN)"
            elif [ "${CURRENT_GHCR_DIGEST}" != "${GHCR_TARGET}" ]; then
              GHCR_LEFTOVER="PRESENT_DIGEST_MISMATCH cur=${CURRENT_GHCR_DIGEST:0:19} target=${GHCR_TARGET:0:19}; 禁止删除"
            else
              VER_CODE=$(curl -s -o /tmp/ghcr-cleanup.json -w "%{http_code}" \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                "https://api.github.com/user/packages/container/qb-release-staging/versions?per_page=100" 2>/dev/null || echo "000")
              if [ "${VER_CODE}" != "200" ]; then
                GHCR_LEFTOVER="REST versions HTTP ${VER_CODE} (UNKNOWN; 禁止删除)"
              else
                MAP_RESULT=$(GHCR_TARGET="${GHCR_TARGET}" CANDIDATE="${CANDIDATE}" python3 /tmp/ghcr-map.py)
                case "${MAP_RESULT}" in
                  VID:*)
                    VID="${MAP_RESULT#VID:}"
                    DEL_CODE=$(curl -L -sS -o /tmp/ghcr-del-body.json -w "%{http_code}" -X DELETE \
                      -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                      -H "Accept: application/vnd.github+json" \
                      -H "X-GitHub-Api-Version: 2026-03-10" \
                      "https://api.github.com/user/packages/container/qb-release-staging/versions/${VID}" 2>/dev/null || echo "000")
                    if [ "${DEL_CODE}" = "204" ]; then
                      sleep 3
                      RB2=$(docker buildx imagetools inspect "ghcr.io/cainiao524/qb-release-staging:${CANDIDATE}" --format '{{.Manifest.Digest}}' 2>&1 || true)
                      if echo "${RB2}" | grep -qi "not found\|no such\|unknown manifest"; then
                        GHCR_OK=true
                      elif echo "${RB2}" | grep -q "sha256:"; then
                        GHCR_LEFTOVER="post-delete 仍可见 (PRESENT)"
                      else
                        GHCR_LEFTOVER="post-delete read-back UNKNOWN: ${RB2}"
                      fi
                    elif [ "${DEL_CODE}" = "400" ]; then
                      # ---- last-tagged message gate：仅 400 且 message 精确匹配才可能 fallback ----
                      echo "::warning::version DELETE HTTP 400; 检查 last-tagged message"
                      python3 /tmp/ghcr-del-parse.py /tmp/ghcr-del-body.json || true
                      LAST_FLAG=$(python3 /tmp/ghcr-fallback.py is_last_tagged /tmp/ghcr-del-body.json)
                      if [ "${LAST_FLAG}" != "LAST_TAGGED" ]; then
                        GHCR_LEFTOVER="delete HTTP 400 但 message 不匹配 last-tagged; 禁止 package DELETE"
                      else
                        # ---- 完整 inventory guard（pagination 枚举 + 单版本严格校验）----
                        INV_RESULT=$(python3 /tmp/ghcr-fallback.py inventory qb-release-staging "${VID}" "${GHCR_TARGET}" "${CANDIDATE}")
                        echo "inventory guard: ${INV_RESULT}"
                        case "${INV_RESULT}" in
                          GUARD_PASS) ;;
                          *) GHCR_LEFTOVER="inventory guard ${INV_RESULT}; 禁止 package DELETE";;
                        esac
                        if [ -z "${GHCR_LEFTOVER}" ]; then
                          # ---- registry digest 复核 ----
                          RB3=$(docker buildx imagetools inspect "ghcr.io/cainiao524/qb-release-staging:${CANDIDATE}" --format '{{.Manifest.Digest}}' 2>&1 || true)
                          CUR3=$(echo "${RB3}" | grep -o "sha256:[a-f0-9]*" | head -1 || true)
                          if [ -z "${CUR3}" ] || [ "${CUR3}" != "${GHCR_TARGET}" ]; then
                            GHCR_LEFTOVER="registry digest 复核失败 (${RB3}); 禁止 package DELETE"
                          else
                            # ---- whole-package DELETE 白名单断言 ----
                            case "qb-release-staging" in
                              qb-release-staging) ;;
                              *) GHCR_LEFTOVER="whole-package DELETE 白名单拒绝; 禁止 DELETE";;
                            esac
                            case "https://api.github.com/user/packages/container/qb-release-staging" in
                              *qbittorrent-next-ui*|*transmission-next-vibemod*)
                                GHCR_LEFTOVER="静态断言失败: production 名出现在 whole-package DELETE URL";;
                            esac
                            if [ -z "${GHCR_LEFTOVER}" ]; then
                              PKG_ASSERT=$(python3 /tmp/ghcr-fallback.py pkg_assert qb-release-staging)
                              if [ "${PKG_ASSERT}" != "PKG_ASSERT_PASS" ]; then
                                GHCR_LEFTOVER="pkg_assert 失败: ${PKG_ASSERT}"
                              else
                                # ---- WHOLE_PACKAGE_FALLBACK ----
                                PKG_CODE=$(curl -L -sS -o /tmp/ghcr-pkg-del.json -w "%{http_code}" -X DELETE \
                                  -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                                  -H "Accept: application/vnd.github+json" \
                                  -H "X-GitHub-Api-Version: 2026-03-10" \
                                  "https://api.github.com/user/packages/container/qb-release-staging" 2>/dev/null || echo "000")
                                echo "DELETE whole package HTTP: ${PKG_CODE}"
                                if [ "${PKG_CODE}" != "204" ]; then
                                  GHCR_LEFTOVER="whole-package DELETE HTTP ${PKG_CODE}"
                                  python3 /tmp/ghcr-del-parse.py /tmp/ghcr-pkg-del.json || true
                                else
                                  sleep 3
                                  REST_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                                    -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                                    -H "Accept: application/vnd.github+json" \
                                    -H "X-GitHub-Api-Version: 2026-03-10" \
                                    "https://api.github.com/user/packages/container/qb-release-staging" 2>/dev/null || echo "000")
                                  echo "REST package read-back: HTTP ${REST_CODE}"
                                  if [ "${REST_CODE}" != "404" ]; then
                                    GHCR_LEFTOVER="REST package 仍可访问 HTTP ${REST_CODE}"
                                  else
                                    RB4=$(docker buildx imagetools inspect "ghcr.io/cainiao524/qb-release-staging:${CANDIDATE}" --format '{{.Manifest.Digest}}' 2>&1 || true)
                                    if echo "${RB4}" | grep -qi "not found\|no such\|unknown manifest"; then
                                      GHCR_OK=true
                                      echo "::notice::GHCR cleanup via whole-package last-tagged fallback (204 + REST 404 + registry ABSENT_CONFIRMED)"
                                    elif echo "${RB4}" | grep -q "sha256:"; then
                                      GHCR_LEFTOVER="whole-package DELETE 后 registry 仍 PRESENT"
                                    else
                                      GHCR_LEFTOVER="whole-package DELETE 后 registry read-back UNKNOWN: ${RB4}"
                                    fi
                                  fi
                                fi
                              fi
                            fi
                          fi
                        fi
                      fi
                    else
                      GHCR_LEFTOVER="delete HTTP ${DEL_CODE}"
                      python3 /tmp/ghcr-del-parse.py /tmp/ghcr-del-body.json || true
                    fi
                    ;;
                  TAG_SET_MISMATCH)
                    GHCR_LEFTOVER="TAG_SET_MISMATCH: 同 digest 但 tags != [${CANDIDATE}]; 禁止删除"
                    ;;
                  UNKNOWN_VERSION_MAPPING)
                    GHCR_LEFTOVER="UNKNOWN_VERSION_MAPPING: registry PRESENT 但 REST 无 exact version; 禁止删除"
                    ;;
                  UNKNOWN_PARSE|UNKNOWN_STRUCTURE)
                    GHCR_LEFTOVER="REST versions 响应异常 (${MAP_RESULT}); 禁止删除"
                    ;;
                  *)
                    GHCR_LEFTOVER="mapping 结果异常: ${MAP_RESULT}"
                    ;;
                esac
              fi
            fi
          else
            GHCR_LEFTOVER="exact candidate read-back UNKNOWN: ${RB_OUT}; 禁止删除"
          fi

          # --- 最终状态输出（P0-5：PARTIAL 必须 exit 1）---
          echo "DH cleanup: ok=${DH_OK} leftover=${DH_LEFTOVER:-none}"
          echo "GHCR cleanup: ok=${GHCR_OK} leftover=${GHCR_LEFTOVER:-none}"
          if [ "${PRE_OK}" = "true" ] && [ "${DH_OK}" = "true" ] && [ "${GHCR_OK}" = "true" ]; then
            echo "::notice::STAGING_REHEARSAL_VERIFIED"
            echo "STAGING_REHEARSAL_VERIFIED" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::REHEARSAL_PARTIAL（未达 VERIFIED）"
          echo "## REHEARSAL_PARTIAL" >> "$GITHUB_STEP_SUMMARY"
          echo "- 前置 job 全部成功: ${PRE_OK}" >> "$GITHUB_STEP_SUMMARY"
          echo "- repository: ${{ github.repository }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- candidate: ${CANDIDATE}" >> "$GITHUB_STEP_SUMMARY"
          echo "- digest(DH): ${DH_SNAP:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "- digest(GHCR restored): ${GHCR_RESTORED:-none}" >> "$GITHUB_STEP_SUMMARY"
          echo "- run-id: ${GITHUB_RUN_ID}" >> "$GITHUB_STEP_SUMMARY"
          echo "- run-attempt: ${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 残留: DH=${DH_LEFTOVER:-none} GHCR=${GHCR_LEFTOVER:-none}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 人工清理建议: 按上述 exact candidate 删除（DH tag DELETE / GHCR Versions）" >> "$GITHUB_STEP_SUMMARY"
          exit 1
