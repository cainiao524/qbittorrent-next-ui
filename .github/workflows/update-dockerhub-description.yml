name: Update Docker Hub description

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Update Docker Hub description
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          REPO_NAME: lowsabishi/qbittorrent-next-ui
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request, urllib.error

          username = os.environ["DOCKERHUB_USERNAME"]
          password = os.environ["DOCKERHUB_TOKEN"]
          repo = os.environ["REPO_NAME"]

          def api(method, url, data=None, token=None):
              req = urllib.request.Request(url, method=method)
              req.add_header("Content-Type", "application/json")
              if token:
                  req.add_header("Authorization", "JWT " + token)
              body = json.dumps(data).encode("utf-8") if data is not None else None
              try:
                  with urllib.request.urlopen(req, body) as resp:
                      return resp.status, resp.read().decode("utf-8")
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8")

          status, text = api("POST", "https://hub.docker.com/v2/users/login",
                             {"username": username, "password": password})
          print("login status:", status)
          if status != 200:
              print(text[:500])
              raise SystemExit(1)
          jwt = json.loads(text)["token"]

          full_desc = open("DOCKERHUB.md", encoding="utf-8").read()
          short_desc = "面向 qBittorrent 的现代化响应式第三方 WebUI"
          status2, text2 = api("PATCH", f"https://hub.docker.com/v2/repositories/{repo}/",
                               {"description": short_desc, "full_description": full_desc}, jwt)
          print("patch status:", status2)
          print(text2[:1000])
          if status2 not in (200, 201):
              raise SystemExit(1)
          print("Docker Hub description updated")
          PYEOF
