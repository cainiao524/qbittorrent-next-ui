name: Update Docker Hub description

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Update Docker Hub description
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          REPO_NAME: lowsabishi/qbittorrent-next-ui
        run: |
          set -euo pipefail
          JWT=$(curl -fsS -X POST https://hub.docker.com/v2/users/login \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"${DOCKERHUB_USERNAME}\",\"password\":\"${DOCKERHUB_TOKEN}\"}" | jq -r .token)
          FULL_DESC=$(python3 -c "import json; print(json.dumps(open('DOCKERHUB.md', encoding='utf-8').read()))")
          SHORT_DESC=$(python3 -c "import json,sys; print(json.dumps(sys.argv[1]))" "面向 qBittorrent 的现代化响应式第三方 WebUI，基于 React + Vite + Tailwind CSS，内置 Nginx 与 API 代理")
          curl -fsS -X PATCH "https://hub.docker.com/v2/repositories/${REPO_NAME}/" \
            -H "Authorization: JWT ${JWT}" \
            -H "Content-Type: application/json" \
            -d "{\"description\": ${SHORT_DESC}, \"full_description\": ${FULL_DESC}}"
          echo "Docker Hub description updated"
