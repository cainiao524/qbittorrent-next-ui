services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Shanghai
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    volumes:
      - ./config:/config
      - ./downloads:/downloads
      - ./dist:/webui:ro
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    stop_grace_period: 10s
    restart: unless-stopped
